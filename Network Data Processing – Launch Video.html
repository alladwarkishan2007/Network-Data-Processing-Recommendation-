<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Data Processing – Launch Video</title>
<style>
:root{--bg:#f2f2f0;--fg:#1a1a1a;--btn:#1a1a1a;--btnfg:#f2f2f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d10;--fg:#e6e6e6;--btn:#e6e6e6;--btnfg:#0b0d10}}
:root[data-theme="dark"]{--bg:#0b0d10;--fg:#e6e6e6;--btn:#e6e6e6;--btnfg:#0b0d10}
html{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
#stage{position:relative;width:100%;max-width:960px;aspect-ratio:16/9;background:#0d1117;border-radius:10px;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;color:#c9d1d9;container-type:inline-size}
.scene{position:absolute;inset:0;padding:5cqw 6cqw;opacity:0;transition:opacity .4s;display:flex;flex-direction:column;justify-content:center}
.scene.on{opacity:1}
.bar{position:absolute;top:0;left:0;right:0;height:3.6cqw;background:#161b22;display:flex;gap:.8cqw;align-items:center;padding-left:1.6cqw}
.bar i{width:1.2cqw;height:1.2cqw;border-radius:50%;background:#30363d}
h1{font-size:7cqw;margin:0 0 2cqw;color:#fff;letter-spacing:-.02em}
.code{font-size:2.6cqw;color:#7ee787;min-height:3.4cqw}
.big{font-size:3.4cqw;color:#ffa657;margin-top:2cqw;opacity:0;transition:opacity .3s}
.big.on{opacity:1}
.cur{display:inline-block;width:.9cqw;height:2.6cqw;background:#c9d1d9;vertical-align:middle;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
#s2{flex-direction:row;align-items:center;gap:3cqw}
svg{width:58%;height:auto}
.edge{stroke:#30363d;stroke-width:1.5;transition:stroke .4s}
.edge.hot{stroke:#58a6ff}
.node circle{fill:#21262d;stroke:#484f58;stroke-width:2;transition:all .4s}
.node text{fill:#c9d1d9;font-size:13px;text-anchor:middle}
.node.me circle{fill:#1f6feb;stroke:#58a6ff}
.node.fof circle{fill:#238636;stroke:#7ee787}
#out{font-size:1.9cqw;line-height:1.7;flex:1;white-space:pre-wrap}
.cap{position:absolute;bottom:1.2cqw;right:2cqw;font-size:1.2cqw;color:#6e7681}
.red{color:#ff7b72}.dim{color:#8b949e}.grn{color:#7ee787}
#s4{align-items:center;text-align:center;background:#0d1117}
#s4 h2{font-size:3.6cqw;color:#fff;margin:0 0 1.6cqw;font-weight:600}
#s4 p{font-size:2.4cqw;color:#7ee787;margin:0}
button{font:inherit;padding:8px 18px;border:0;border-radius:6px;background:var(--btn);color:var(--btnfg);cursor:pointer}
small{opacity:.7;text-align:center}
</style></head><body>
<div id="stage">
 <div class="bar"><i></i><i></i><i></i></div>
 <div class="scene" id="s1"><h1>People You May Know</h1><div class="code" id="c1"></div><div class="big" id="b1">That’s the entire tech stack.</div></div>
 <div class="scene" id="s2"><svg id="g" viewBox="0 0 400 400"></svg><div id="out"></div><div class="cap">sample data – swap in your data.json</div></div>
 <div class="scene" id="s3"><div id="rep" style="font-size:2cqw;line-height:1.8"></div></div>
 <div class="scene" id="s4"><h2>Social Network Data Processing &amp; Recommendation System</h2><p>Pure Python. Zero libraries.</p></div>
</div>
<button id="play">Replay</button>
<small>Screen-record the stage (about 15 s). Data shown is placeholder.</small>
<script>
const names=["Priya","Arjun","Meera","Rohan","Anika","Dev","Sana","Kabir","Isha","Vikram"];
const edges=[[0,1],[0,2],[1,3],[1,4],[2,5],[2,6],[3,7],[4,8],[6,8],[5,9],[7,9]];
const fof=[3,4,5,6];
const $=id=>document.getElementById(id);
const pos=names.map((_,i)=>{const a=i/10*Math.PI*2-Math.PI/2;return[200+150*Math.cos(a),200+150*Math.sin(a)]});
function build(){
 let h="";
 edges.forEach(([a,b],i)=>{h+=`<line class="edge" id="e${i}" x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}"/>`});
 names.forEach((n,i)=>{h+=`<g class="node" id="n${i}"><circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="20"/><text x="${pos[i][0]}" y="${pos[i][1]+36}">${n}</text></g>`});
 $("g").innerHTML=h;
}
let timers=[];
const at=(ms,f)=>timers.push(setTimeout(f,ms));
function show(id){document.querySelectorAll(".scene").forEach(s=>s.classList.toggle("on",s.id===id))}
function type(el,txt,start,step){[...txt].forEach((_,i)=>at(start+i*step,()=>{el.innerHTML=txt.slice(0,i+1)+'<span class="cur"></span>'}))}
function run(){
 timers.forEach(clearTimeout);timers=[];build();
 $("c1").innerHTML='<span class="cur"></span>';$("b1").classList.remove("on");$("out").textContent="";$("rep").innerHTML="";
 show("s1");
 type($("c1"),"import json",1000,70);
 at(2200,()=>$("b1").classList.add("on"));
 at(3800,()=>{show("s2");$("n0").classList.add("me")});
 at(4600,()=>{[0,1].forEach(i=>$("e"+i).classList.add("hot"))});
 at(5400,()=>{[2,3,4,5].forEach(i=>$("e"+i).classList.add("hot"));fof.forEach(i=>$("n"+i).classList.add("fof"))});
 const lines=["$ python recommend.py Priya","","People You May Know:","  Rohan   1 mutual (Arjun)","  Anika   1 mutual (Arjun)","  Dev     1 mutual (Meera)","  Sana    1 mutual (Meera)"];
 lines.forEach((l,i)=>at(5600+i*350,()=>{$("out").textContent+=l+"\n"}));
 at(9000,()=>{show("s3");
  const r=[["$ python validate.py data.json","dim"],["Validating 10 users...","dim"],["[WARN] user 4: duplicate friend id","red"],["[WARN] user 7: friend id 99 not found","red"],["[WARN] user 9: missing 'name' field","red"],["[WARN] user 2: self-friendship","red"],["Report written to report.txt","grn"]];
  r.forEach(([t,c],i)=>at(i*450,()=>{$("rep").innerHTML+=`<div class="${c}">${t}</div>`}));});
 at(12800,()=>show("s4"));
}
$("play").onclick=run;run();
</script></body></html>
